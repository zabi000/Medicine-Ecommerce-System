<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login - MEDIX Pharmacy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }
        .login-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }
        .card-header-admin {
            background: linear-gradient(135deg, #B91C1C, #7F1D1D);
            padding: 2.5rem 2rem;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="card-header-admin">
            <i class="bi bi-shield-lock-fill fs-1 mb-2 d-block"></i>
            <h4 class="fw-bold mb-1">MEDIX Admin Portal</h4>
            <small class="text-white-50">Authorized Healthcare Management</small>
        </div>
        <div class="p-4">
            <div class="alert alert-info py-2 small mb-3">
                <i class="bi bi-info-circle-fill me-1"></i> Default Login: <strong>admin</strong> / <strong>admin123</strong>
            </div>
            <form id="adminLoginForm">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Username / Email</label>
                    <input type="text" class="form-control" id="adminUser" value="admin" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Password</label>
                    <input type="password" class="form-control" id="adminPass" value="admin123" required>
                </div>
                <button type="submit" class="btn btn-danger w-100 py-2 rounded-pill fw-bold">
                    Login to Dashboard
                </button>
                <div class="text-center mt-3">
                    <a href="/index.html" class="small text-muted text-decoration-none">&larr; Return to Store</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('adminUser').value;
            const password = document.getElementById('adminPass').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: username, password })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/admin/index.html';
                } else {
                    alert(data.message || 'Login failed');
                }
            } catch (err) {
                alert('Connection error');
            }
        });
    </script>
</body>
</html>
